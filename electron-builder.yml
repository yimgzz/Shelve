# electron-builder configuration (master plan §5, §7; phase E5).
#
# E2 wired the unpacked Linux build used by `make build` / `make run`
# (`electron-builder --linux dir` -> bin/linux-unpacked/shelve). E5 adds the
# AppImage target (`make appimage` -> bin/shelve-<version>-x86_64.AppImage) and
# the final artifact metadata. Linux is the only target.
appId: "io.shelve.app"
productName: "Shelve"
executableName: "shelve"
copyright: "(c) 2026, Shelve"

directories:
  output: "bin"
  buildResources: "build"

# The main/preload bundles and the renderer are self-contained (esbuild bundles
# main/preload; Vite bundles the renderer), so no node_modules ship at runtime.
files:
  - "dist-electron/**"
  - "frontend/dist/**"
  - "package.json"
  - "!node_modules/**"

# Only the English Chromium resource pack ships. The app's own UI is
# English-only (AGENTS.md §7); the remaining Chromium strings fall back to
# en-US regardless of the OS locale. Drops ~46 MB of unused locales/*.pak.
electronLanguages:
  - "en-US"

# E2-D4: the Go backend is a plain child process shipped next to the app,
# OUTSIDE the asar. main.ts resolves it at
# process.resourcesPath/backend/shelve-backend.
extraResources:
  - from: "bin/shelve-backend"
    to: "backend/shelve-backend"

asar: true
# No native modules: never rebuild anything against the Electron ABI.
npmRebuild: false

linux:
  target:
    - "AppImage"
  # electron-builder appends the trailing ";": Network;Utility;
  category: "Network;Utility"
  icon: "build/icon.png"
  # Keep the installed `shelve.desktop` name in sync with Electron's app_id /
  # WM_CLASS (`desktopName` in package.json), so panels associate the running
  # window with this entry.
  syncDesktopName: true
  artifactName: "shelve-${version}-${arch}.AppImage"
  # The desktop entry's Comment is derived from `description`.
  synopsis: "Lightweight local SSH session manager"
  description: "Local-first SSH session manager with an encrypted vault."

# The app is GPL/private; do not embed a EULA into the AppImage. The desktop
# Exec gets NO forced `--no-sandbox`: electron-builder would otherwise bake it
# into `Exec=AppRun --no-sandbox %U` for the legacy AppImage toolset, which
# would disable the Chromium sandbox for every desktop launch. With an empty
# arg list, AppRun's own `unshare -Ur` probe (and main.ts) decides, so the
# sandbox stays on where the host supports it (phase E5 task 2).
appImage:
  license: null
  executableArgs: []
  # xz compresses far better than the legacy FUSE2 default (gzip) at the cost
  # of a much slower package step. The legacy toolset forwards
  # `-comp xz -Xdict-size 100% -b 1048576`.
  compression: "xz"
