# electron-builder configuration (master plan §5, §7; phase E2).
#
# E2 wires only the unpacked Linux build used by `make build` / `make run`:
# `electron-builder --linux dir` -> bin/linux-unpacked/shelve. The AppImage
# target and the final artifact metadata land in E5.
appId: "dev.shelve.app"
productName: "shelve"

directories:
  output: "bin"
  buildResources: "build"

# The main/preload bundles and the renderer are self-contained (esbuild bundles
# main/preload; Vite bundles the renderer), so no node_modules ship at runtime.
files:
  - "dist-electron/**"
  - "frontend/dist/**"
  - "electron/placeholder.*"
  - "package.json"
  - "!node_modules/**"

# E2-D4: the Go backend is a plain child process shipped next to the app.
# main.ts resolves it at process.resourcesPath/backend/shelve-backend.
extraResources:
  - from: "bin/shelve-backend"
    to: "backend/shelve-backend"

linux:
  executableName: "shelve"
  category: "Network"
  synopsis: "Local-first SSH session manager"
