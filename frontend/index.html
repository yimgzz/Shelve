<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- FOUC guard (master plan §6): set the theme from the cached
         value before first paint so no theme flash occurs on reload.
         ui/theme.ts keeps this cache in sync. -->
    <script>
        (function () {
            try {
                var cached = localStorage.getItem("dsm-theme");
                if (cached === "light" || cached === "dark") {
                    document.documentElement.dataset.theme = cached;
                }
            } catch (_) {
                /* localStorage unavailable — fall back to default theme */
            }
        })();
    </script>
    <link rel="stylesheet" href="/src/style/themes.css"/>
    <link rel="stylesheet" href="/src/style/base.css"/>
    <link rel="stylesheet" href="/src/style/components.css"/>
    <title>Dummy SSH Manager</title>
</head>
<body>
<div id="app-root"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
